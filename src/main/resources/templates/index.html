<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>GitPulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff6eb4;
            --mint: #00f5c4;
            --lavender: #c4b5fd;
            --yellow: #fde68a;
            --bg: #080b14;
            --surface: #0f1420;
            --border: rgba(255,110,180,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* animated background blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            animation: drift 8s ease-in-out infinite alternate;
        }
        .blob-1 { width: 500px; height: 500px; background: var(--pink); top: -100px; left: -100px; animation-delay: 0s; }
        .blob-2 { width: 400px; height: 400px; background: var(--mint); bottom: -80px; right: -80px; animation-delay: -3s; }
        .blob-3 { width: 300px; height: 300px; background: var(--lavender); top: 40%; left: 40%; animation-delay: -6s; }

        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(30px, 20px) scale(1.08); }
        }

        /* grid overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                    linear-gradient(rgba(255,110,180,0.04) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,110,180,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 580px;
            width: 100%;
        }

        /* floating badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,110,180,0.1);
            border: 1px solid rgba(255,110,180,0.3);
            border-radius: 100px;
            padding: 6px 16px;
            font-size: 12px;
            color: var(--pink);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 28px;
            animation: fadeUp 0.6s ease both;
        }
        .badge-dot {
            width: 6px; height: 6px;
            background: var(--pink);
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: clamp(52px, 10vw, 80px);
            line-height: 0.95;
            margin-bottom: 16px;
            animation: fadeUp 0.6s 0.1s ease both;
        }
        .logo-git { color: #fff; }
        .logo-pulse {
            background: linear-gradient(135deg, var(--pink) 0%, var(--lavender) 50%, var(--mint) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 15px;
            color: #94a3b8;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 40px;
            animation: fadeUp 0.6s 0.2s ease both;
        }
        .tagline span { color: var(--mint); font-style: italic; }

        /* search card */
        .search-card {
            background: rgba(15, 20, 32, 0.8);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            backdrop-filter: blur(20px);
            animation: fadeUp 0.6s 0.3s ease both;
            position: relative;
            overflow: hidden;
        }
        .search-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--pink), var(--lavender), var(--mint), transparent);
        }

        .search-row {
            display: flex;
            gap: 10px;
        }

        .input-wrap {
            flex: 1;
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
            font-size: 16px;
            pointer-events: none;
        }
        input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 14px 16px 14px 40px;
            font-size: 15px;
            color: #e2e8f0;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: #334155; }
        input:focus {
            border-color: rgba(255,110,180,0.4);
            box-shadow: 0 0 0 3px rgba(255,110,180,0.08);
        }

        button {
            background: linear-gradient(135deg, var(--pink), #a855f7);
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 15px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            color: white;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 20px rgba(255,110,180,0.3);
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(255,110,180,0.4);
        }
        button:active { transform: translateY(0); }

        /* suggestion pills */
        .suggestions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 16px;
            justify-content: center;
        }
        .pill {
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 100px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            color: #64748b;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'DM Sans', sans-serif;
        }
        .pill:hover {
            background: rgba(255,110,180,0.08);
            border-color: rgba(255,110,180,0.25);
            color: var(--pink);
        }

        /* stats row */
        .stats-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 36px;
            animation: fadeUp 0.6s 0.4s ease both;
        }
        .stat {
            text-align: center;
        }
        .stat-num {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 22px;
            color: #fff;
        }
        .stat-label {
            font-size: 11px;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 2px;
        }
        .stat-div {
            width: 1px;
            background: rgba(255,255,255,0.07);
            align-self: stretch;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="container">
    <div class="badge">
        <div class="badge-dot"></div>
        AI-Powered Developer Profiles
    </div>

    <div class="logo">
        <span class="logo-git">Git</span><span class="logo-pulse">Pulse</span>
    </div>

    <p class="tagline">
        Drop any GitHub username.<br>
        Get a <span>beautiful developer card</span> in seconds.
    </p>

    <div class="search-card">
        <div class="search-row">
            <div class="input-wrap">
                <span class="input-icon">@</span>
                <input type="text" id="username" placeholder="github username" autofocus/>
            </div>
            <button onclick="search()">Analyze ✦</button>
        </div>
        <div class="suggestions">
            <span class="pill" onclick="fill('torvalds')">torvalds</span>
            <span class="pill" onclick="fill('gaearon')">gaearon</span>
            <span class="pill" onclick="fill('NITHINKR06')">NITHINKR06</span>
            <span class="pill" onclick="fill('sindresorhus')">sindresorhus</span>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat">
            <div class="stat-num">∞</div>
            <div class="stat-label">Profiles</div>
        </div>
        <div class="stat-div"></div>
        <div class="stat">
            <div class="stat-num">Live</div>
            <div class="stat-label">GitHub Data</div>
        </div>
        <div class="stat-div"></div>
        <div class="stat">
            <div class="stat-num">Free</div>
            <div class="stat-label">Always</div>
        </div>
    </div>
</div>

<script>
    function search() {
        const username = document.getElementById('username').value.trim();
        if (username) window.location.href = '/profile/' + username;
    }
    function fill(name) {
        document.getElementById('username').value = name;
        document.getElementById('username').focus();
    }
    document.getElementById('username').addEventListener('keypress', e => {
        if (e.key === 'Enter') search();
    });
</script>
</body>
</html>
