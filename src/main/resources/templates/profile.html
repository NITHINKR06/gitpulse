<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>GitPulse</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #0d1117; color: #c9d1d9; }
        .header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        img { border-radius: 50%; width: 100px; }
        h1 { margin: 0; font-size: 24px; }
        .bio { color: #8b949e; margin: 4px 0; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 24px 0; }
        .stat-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; text-align: center; }
        .stat-num { font-size: 28px; font-weight: bold; color: #58a6ff; }
        .stat-label { font-size: 12px; color: #8b949e; margin-top: 4px; }
        .section { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin: 16px 0; }
        h2 { color: #f0f6fc; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
        .repo { padding: 10px 0; border-bottom: 1px solid #21262d; }
        .repo:last-child { border-bottom: none; }
        .repo a { color: #58a6ff; text-decoration: none; font-weight: 500; }
        .repo a:hover { text-decoration: underline; }
        .repo-meta { font-size: 12px; color: #8b949e; margin-top: 4px; }
        .lang-bar { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
        .lang-name { width: 120px; font-size: 13px; }
        .bar-bg { flex: 1; background: #21262d; border-radius: 4px; height: 8px; }
        .bar-fill { background: #58a6ff; border-radius: 4px; height: 8px; }
        .lang-pct { font-size: 12px; color: #8b949e; width: 40px; text-align: right; }
    </style>
</head>
<body>

<div class="header">
    <img th:src="${profile.avatarUrl}" alt="avatar"/>
    <div>
        <h1 th:text="${profile.name != null ? profile.name : profile.username}"></h1>
        <p class="bio" th:text="${profile.bio}"></p>
        <a th:href="${profile.githubUrl}" style="color:#58a6ff" target="_blank">
            @<span th:text="${profile.username}"></span>
        </a>
    </div>
</div>

<div class="stats">
    <div class="stat-box">
        <div class="stat-num" th:text="${profile.totalRepos}"></div>
        <div class="stat-label">Repositories</div>
    </div>
    <div class="stat-box">
        <div class="stat-num" th:text="${profile.followers}"></div>
        <div class="stat-label">Followers</div>
    </div>
    <div class="stat-box">
        <div class="stat-num" th:text="${profile.totalStars}"></div>
        <div class="stat-label">Total Stars</div>
    </div>
    <div class="stat-box">
        <div class="stat-num" th:text="${profile.totalForks}"></div>
        <div class="stat-label">Total Forks</div>
    </div>
</div>

<div class="section">
    <h2>Top Repositories</h2>
    <div class="repo" th:each="repo : ${profile.topRepos}">
        <a th:href="${repo.html_url}" th:text="${repo.name}" target="_blank"></a>
        <div class="repo-meta">
            <span th:text="${repo.language}"></span> ·
            ⭐ <span th:text="${repo.stargazers_count}"></span> ·
            🍴 <span th:text="${repo.forks_count}"></span>
        </div>
        <div style="font-size:12px; color:#8b949e; margin-top:4px" th:text="${repo.description}"></div>
    </div>
</div>

<div class="section">
    <h2>Languages</h2>
    <div class="lang-bar" th:each="lang : ${profile.languagePercentages}">
        <div class="lang-name" th:text="${lang.key}"></div>
        <div class="bar-bg">
            <div class="bar-fill" th:style="'width:' + ${lang.value} + '%'"></div>
        </div>
        <div class="lang-pct" th:text="${lang.value} + '%'"></div>
    </div>
</div>

</body>
</html>
