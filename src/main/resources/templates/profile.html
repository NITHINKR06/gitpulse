<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="'GitPulse — ' + ${profile.username}">GitPulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff6eb4;
            --mint: #00f5c4;
            --lavender: #c4b5fd;
            --yellow: #fde68a;
            --bg: #080b14;
            --surface: #0f1420;
            --surface2: #141927;
            --border: rgba(255,255,255,0.06);
            --text: #e2e8f0;
            --muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                    radial-gradient(ellipse 600px 400px at 10% 10%, rgba(255,110,180,0.07) 0%, transparent 70%),
                    radial-gradient(ellipse 500px 400px at 90% 80%, rgba(0,245,196,0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .page { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 32px 20px 60px; }

        /* back nav */
        .nav {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--muted);
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 100px;
            border: 1px solid var(--border);
            transition: all 0.15s;
        }
        .back-btn:hover { color: var(--pink); border-color: rgba(255,110,180,0.3); }
        .brand {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 18px;
        }
        .brand-git { color: #fff; }
        .brand-pulse {
            background: linear-gradient(135deg, var(--pink), var(--lavender));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* hero header */
        .hero {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 24px;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--pink), var(--lavender), var(--mint), transparent);
        }

        .avatar-wrap { position: relative; flex-shrink: 0; }
        .avatar {
            width: 90px; height: 90px;
            border-radius: 50%;
            border: 2px solid rgba(255,110,180,0.3);
            display: block;
        }
        .avatar-ring {
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            background: linear-gradient(135deg, var(--pink), var(--lavender), var(--mint)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            animation: spin 6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hero-info { flex: 1; min-width: 0; }
        .hero-name {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 28px;
            color: #fff;
            margin-bottom: 4px;
        }
        .hero-bio { font-size: 14px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; font-weight: 300; }
        .hero-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: var(--pink);
            text-decoration: none;
            padding: 4px 12px;
            border-radius: 100px;
            background: rgba(255,110,180,0.08);
            border: 1px solid rgba(255,110,180,0.2);
        }
        .hero-link:hover { background: rgba(255,110,180,0.15); }

        .hero-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 100px;
            font-weight: 500;
            letter-spacing: 0.04em;
        }
        .badge-lang { background: rgba(0,245,196,0.1); color: var(--mint); border: 1px solid rgba(0,245,196,0.2); }
        .badge-repos { background: rgba(196,181,253,0.1); color: var(--lavender); border: 1px solid rgba(196,181,253,0.2); }

        /* stats grid */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            transition: border-color 0.2s, transform 0.2s;
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover { border-color: rgba(255,110,180,0.25); transform: translateY(-2px); }
        .stat-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 2px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .stat-card:nth-child(1)::after { background: var(--pink); }
        .stat-card:nth-child(2)::after { background: var(--lavender); }
        .stat-card:nth-child(3)::after { background: var(--mint); }
        .stat-card:nth-child(4)::after { background: var(--yellow); }
        .stat-card:hover::after { opacity: 1; }

        .stat-num {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 32px;
            line-height: 1;
            margin-bottom: 6px;
        }
        .stat-card:nth-child(1) .stat-num { color: var(--pink); }
        .stat-card:nth-child(2) .stat-num { color: var(--lavender); }
        .stat-card:nth-child(3) .stat-num { color: var(--mint); }
        .stat-card:nth-child(4) .stat-num { color: var(--yellow); }
        .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }

        /* two col layout */
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }

        /* section card */
        .section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 16px;
        }
        .section-title {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* repo list */
        .repo {
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .repo:last-child { border-bottom: none; padding-bottom: 0; }
        .repo:first-child { padding-top: 0; }
        .repo-name {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: color 0.15s;
        }
        .repo-name:hover { color: var(--pink); }
        .repo-desc { font-size: 12px; color: var(--muted); margin-top: 3px; font-weight: 300; line-height: 1.4; }
        .repo-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
        }
        .repo-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 100px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            color: #94a3b8;
        }
        .repo-stars { font-size: 12px; color: var(--yellow); }
        .repo-forks { font-size: 12px; color: #64748b; }

        /* language bars */
        .lang-item { margin-bottom: 12px; }
        .lang-item:last-child { margin-bottom: 0; }
        .lang-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .lang-name { font-size: 13px; color: var(--text); font-weight: 400; }
        .lang-pct { font-size: 12px; color: var(--muted); font-family: 'Syne', sans-serif; font-weight: 700; }
        .bar-track {
            height: 5px;
            background: rgba(255,255,255,0.05);
            border-radius: 100px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 100px;
            background: linear-gradient(90deg, var(--pink), var(--lavender));
            transition: width 0.8s ease;
        }

        /* footer */
        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 12px;
            color: #1e293b;
        }
        .footer a { color: #334155; text-decoration: none; }
        .footer a:hover { color: var(--pink); }

        @media (max-width: 600px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .two-col { grid-template-columns: 1fr; }
            .hero { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="page">

    <nav class="nav">
        <a href="/" class="back-btn">← Back</a>
        <div class="brand"><span class="brand-git">Git</span><span class="brand-pulse">Pulse</span></div>
    </nav>

    <!-- Hero -->
    <div class="hero">
        <div class="avatar-wrap">
            <img class="avatar" th:src="${profile.avatarUrl}" alt="avatar"/>
            <div class="avatar-ring"></div>
        </div>
        <div class="hero-info">
            <div class="hero-name" th:text="${profile.name != null ? profile.name : profile.username}"></div>
            <div class="hero-bio" th:text="${profile.bio != null ? profile.bio : 'No bio available'}"></div>
            <a class="hero-link" th:href="${profile.githubUrl}" target="_blank">
                ↗ @<span th:text="${profile.username}"></span>
            </a>
            <div class="hero-badges">
                <span class="badge badge-lang" th:text="'✦ ' + ${profile.mostUsedLanguage}"></span>
                <span class="badge badge-repos" th:text="${profile.originalRepos} + ' original repos'"></span>
            </div>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats">
        <div class="stat-card">
            <div class="stat-num" th:text="${profile.totalRepos}"></div>
            <div class="stat-label">Repositories</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" th:text="${profile.followers}"></div>
            <div class="stat-label">Followers</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" th:text="${profile.totalStars}"></div>
            <div class="stat-label">Total Stars</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" th:text="${profile.totalForks}"></div>
            <div class="stat-label">Total Forks</div>
        </div>
    </div>

    <!-- Two col: repos + languages -->
    <div class="two-col">

        <div class="section">
            <div class="section-title">Top Repos</div>
            <div th:each="repo : ${profile.topRepos}" class="repo">
                <a class="repo-name" th:href="${repo.html_url}" th:text="${repo.name}" target="_blank"></a>
                <div class="repo-desc" th:text="${repo.description != null ? repo.description : 'No description'}"></div>
                <div class="repo-meta">
                    <span class="repo-tag" th:if="${repo.language != null}" th:text="${repo.language}"></span>
                    <span class="repo-stars" th:text="'⭐ ' + ${repo.stargazers_count}"></span>
                    <span class="repo-forks" th:text="'⑂ ' + ${repo.forks_count}"></span>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Languages</div>
            <div th:each="lang : ${profile.languagePercentages}" class="lang-item">
                <div class="lang-header">
                    <span class="lang-name" th:text="${lang.key}"></span>
                    <span class="lang-pct" th:text="${lang.value} + '%'"></span>
                </div>
                <div class="bar-track">
                    <div class="bar-fill" th:style="'width:' + ${lang.value} + '%'"></div>
                </div>
            </div>
        </div>

    </div>

    <div class="footer">
        Built with ✦ by <a href="https://github.com/NITHINKR06" target="_blank">NITHINKR06</a>
        · Powered by GitHub REST API
    </div>

</div>
</body>
</html>
