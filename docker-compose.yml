#Just to run redis can skip run locally without docker it works

version: '3.8'
services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - GITHUB_API_TOKEN=${GITHUB_API_TOKEN}
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      - redis